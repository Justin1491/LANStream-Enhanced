<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#05070a">
<meta name="lanstream-csrf" content="{{ csrf_token }}">
<link rel="icon" href="data:,">
<title>{{ filename }} · LANStream</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body class="player-body">
<div class="player-shell" id="playerShell">
<div class="player-top">
<a class="player-back" href="{{ url_for('video_detail', root_index=root_index, relpath=relpath) }}">← Back to details</a>
<div class="player-title">{{ filename }}</div>
{% include 'favorite_button.html' %}
<button id="fullscreenTop" type="button" aria-label="Enter fullscreen">Fullscreen</button>
</div>
<div class="video-stage" id="videoStage"><video id="video" playsinline preload="metadata"></video>
<div id="playerMessage" class="player-message">Starting playback…</div></div>
<div class="player-controls" id="playerControls">
<div class="player-seek-row">
<span id="currentLabel">0:00</span>
<input id="seek" type="range" min="0" max="{{ duration }}" value="0" step="0.1" aria-label="Seek">
<span class="duration-label">{{ duration_text }}</span>
</div>
<div class="player-control-row">
<div class="player-transport">
<button id="togglePlay" type="button">Play</button>
<button id="back30" type="button" title="Back 30 seconds" aria-label="Back 30 seconds">&lt;&lt;</button>
<button id="forward30" type="button" title="Forward 30 seconds" aria-label="Forward 30 seconds">&gt;&gt;</button>
</div>
<div class="quality-mode" role="radiogroup" aria-label="Stream quality">
<label><input type="radio" name="qualityMode" value="normal" checked> Normal</label>
<label><input type="radio" name="qualityMode" value="low"> Low Bandwidth</label>
</div>
{% if audios %}<select id="audioSelect" title="Audio" aria-label="Audio track">{% for a in audios %}
<option value="{{ a.index }}">{{ a.language }} · {{ a.codec }}{% if a.title %} · {{ a.title }}{% endif %}</option>
{% endfor %}</select>{% endif %}
{% set text_subs = subtitles | selectattr("text_supported") | list %}
{% if text_subs %}<select id="subtitleSelect" title="Subtitles" aria-label="Subtitles"><option value="">Subtitles off</option>{% for s in text_subs %}
<option value="{{ s.index }}">{{ s.language }}{% if s.title %} · {{ s.title }}{% endif %}</option>{% endfor %}</select>{% endif %}
<div class="volume-control">
<span class="volume-label">Vol</span>
<input id="volume" type="range" min="0" max="1" value="1" step="0.05" aria-label="Volume">
</div>
</div>
</div>
</div>
<details id="playbackDiagnostics" hidden><summary>Playback details</summary><pre id="playbackReport"></pre></details>
<script>
const nativePlayback={{ "true" if native else "false" }};
const totalDuration={{ duration }};
const playerShell=document.getElementById("playerShell"),
 video=document.getElementById("video"), message=document.getElementById("playerMessage"),
 playerControls=document.getElementById("playerControls"),
 togglePlay=document.getElementById("togglePlay"), back30=document.getElementById("back30"),
 forward30=document.getElementById("forward30"), seek=document.getElementById("seek"),
 currentLabel=document.getElementById("currentLabel"), volume=document.getElementById("volume"),
 fullscreenTop=document.getElementById("fullscreenTop"), audioSelect=document.getElementById("audioSelect"),
 subtitleSelect=document.getElementById("subtitleSelect");
const nativeUrl={{ url_for('media_file',root_index=root_index,relpath=relpath)|tojson }};
const transcodeBase={{ url_for('transcoded_media',root_index=root_index,relpath=relpath)|tojson }};
const hlsBase={{ url_for('hls_media',root_index=root_index,relpath=relpath)|tojson }};
const hlsToken={{ hls_token|tojson }};
const nativeHls=!!(video.canPlayType&&video.canPlayType('application/vnd.apple.mpegurl'));
const subtitleBase={{ url_for('subtitle',root_index=root_index,relpath=relpath)|tojson }};
let logicalOffset=0,started=false,dragging=false,lowBandwidth=false,controlsTimer=null,hlsSerial=0,hlsResumeAt=null,preparing=false,lastReport=null,needsPlayGesture=false;

function fmt(sec){sec=Math.max(0,Math.floor(sec||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`;}
function usingDirect(){return nativePlayback&&!lowBandwidth;}
function logicalTime(){return preparing?logicalOffset:usingDirect()?(video.currentTime||0):logicalOffset+(video.currentTime||0);}
function audio(){return audioSelect?audioSelect.value:"";}
function msg(t){message.textContent=t;message.classList.toggle("hidden",!t);}
function playbackRejected(error){if(error.name==="NotAllowedError"){needsPlayGesture=true;msg("Tap Play to start playback.");}}
function subtitles(start){
 video.querySelectorAll("track").forEach(t=>t.remove());
 if(!subtitleSelect||!subtitleSelect.value)return;
 const t=document.createElement("track");t.kind="subtitles";t.label="Selected";t.srclang="en";t.default=true;
 t.src=subtitleBase+"?stream="+encodeURIComponent(subtitleSelect.value)+"&start="+encodeURIComponent(start);video.appendChild(t);
}
function playbackReport(report){
 lastReport=report;
 const details=document.getElementById('playbackDiagnostics'),output=document.getElementById('playbackReport');
 details.hidden=false;
 output.textContent=JSON.stringify({server:report,browser:{readyState:video.readyState,
  width:video.videoWidth||0,height:video.videoHeight||0,error:video.error?video.error.code:null}},null,2);
}
async function prepareHls(url,generation){
 const deadline=Date.now()+90000;
 try{
  while(generation===hlsSerial){
   const response=await fetch(url+'&prepare=1',{cache:'no-store'});
   const report=await response.json();
   if(generation!==hlsSerial)return;
   playbackReport(report);
   if(!response.ok||report.state==='failed'){
    preparing=false;msg('The server encoder failed to start playback. Open Playback details for the failure.');return;
   }
   if(report.state==='ready'){
    preparing=false;video.src=url;video.load();video.play().catch(playbackRejected);return;
   }
   if(Date.now()>=deadline){
    preparing=false;msg('The server has not published a playable stream after 90 seconds. Open Playback details.');return;
   }
   msg('Preparing playback…');
   await new Promise(resolve=>window.setTimeout(resolve,1000));
  }
 }catch(_){
  if(generation===hlsSerial){preparing=false;msg('Unable to check playback startup. Reload the page and try again.');}
 }
}
function transcode(at){
 hlsResumeAt=null;needsPlayGesture=false;
 logicalOffset=Math.max(0,Math.min(totalDuration,at));subtitles(logicalOffset);msg("Starting transcoded stream…");
 const generation=++hlsSerial,base=nativeHls?hlsBase:transcodeBase,stream=nativeHls?"stream="+hlsToken+"-"+generation+"&":"";
 const url=base+"?"+stream+"start="+encodeURIComponent(logicalOffset)+"&audio="+encodeURIComponent(audio())+(lowBandwidth?"&low=1":"");
 if(nativeHls){
  preparing=true;if(video.pause)video.pause();hlsResumeAt=null;video.removeAttribute('src');video.load();
  prepareHls(url,generation);return;
 }
 video.src=url;
 video.load();video.play().catch(playbackRejected);
}
function start(at=0){
 hlsResumeAt=null;
 if(usingDirect()){
  ++hlsSerial;preparing=false;
  if(!started){subtitles(0);video.src=nativeUrl;video.load();}
  const playAt=()=>{try{video.currentTime=at;}catch(_){} video.play().catch(playbackRejected);};
  if(video.readyState>=1)playAt();else video.addEventListener("loadedmetadata",playAt,{once:true});
 }else transcode(at);
 started=true;
}
function go(t){t=Math.max(0,Math.min(totalDuration,t));if(!started)return start(t);usingDirect()?video.currentTime=t:transcode(t);}
function fullscreenElement(){return document.fullscreenElement||document.webkitFullscreenElement||null;}
function isFullscreen(){return fullscreenElement()===playerShell||!!video.webkitDisplayingFullscreen;}
async function toggleFullscreen(){
 try{
  if(video.webkitDisplayingFullscreen){
   video.webkitExitFullscreen();
  }else if(isFullscreen()){
   if(document.exitFullscreen)await document.exitFullscreen();
   else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }else{
   if(playerShell.requestFullscreen&&document.fullscreenEnabled!==false)await playerShell.requestFullscreen();
   else if(playerShell.webkitRequestFullscreen&&document.webkitFullscreenEnabled!==false)playerShell.webkitRequestFullscreen();
   // iPhone Safari uses native video fullscreen when page fullscreen is unavailable.
   else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
   else msg("Fullscreen is not supported by this browser.");
  }
 }catch(_){msg("Unable to change fullscreen. Start playback and try again.");}
}
function clearControlsTimer(){if(controlsTimer!==null){window.clearTimeout(controlsTimer);controlsTimer=null;}}
function scheduleControlsHide(){
 clearControlsTimer();
 if(!isFullscreen()||video.paused||dragging)return;
 controlsTimer=window.setTimeout(()=>{if(isFullscreen()&&!video.paused&&!dragging)playerShell.classList.add("controls-hidden");},3000);
}
function showControls(){playerShell.classList.remove("controls-hidden");scheduleControlsHide();}
function updateFullscreenState(){
 const active=isFullscreen();
 playerShell.classList.toggle("is-fullscreen",active);
 fullscreenTop.textContent=active?"Exit Fullscreen":"Fullscreen";
 fullscreenTop.setAttribute("aria-label",active?"Exit fullscreen":"Enter fullscreen");
 showControls();
}

togglePlay.onclick=()=>{showControls();if(preparing)return;if(!started)return start(0);if(needsPlayGesture){needsPlayGesture=false;video.play().catch(playbackRejected);return;}if(video.paused&&nativeHls&&!usingDirect())return go(video.ended?0:logicalTime());video.paused?video.play().catch(playbackRejected):video.pause();};
back30.onclick=()=>{showControls();go(logicalTime()-30);};
forward30.onclick=()=>{showControls();go(logicalTime()+30);};
video.addEventListener("playing",()=>{needsPlayGesture=false;msg("");togglePlay.textContent="Pause";scheduleControlsHide();});
video.addEventListener("pause",()=>{if(!preparing&&nativeHls&&!usingDirect()&&started&&video.readyState>=1)hlsResumeAt=logicalTime();togglePlay.textContent="Play";showControls();clearControlsTimer();});
video.addEventListener("play",()=>{if(hlsResumeAt!==null){const at=hlsResumeAt;hlsResumeAt=null;go(at>=totalDuration-0.1?0:at);}});
video.addEventListener("waiting",()=>{if(started&&!video.paused)msg("Buffering…");});
video.addEventListener("error",()=>{if(preparing)return;const e=video.error;msg("Playback failed"+(e?` (browser error ${e.code})`:"")+". Open Playback details or /transcoder-status.");if(lastReport)playbackReport(lastReport);});
seek.oninput=()=>{dragging=true;showControls();currentLabel.textContent=fmt(Number(seek.value));};
seek.onchange=()=>{dragging=false;go(Number(seek.value));scheduleControlsHide();};
video.addEventListener("timeupdate",()=>{if(dragging)return;const t=Math.min(totalDuration,logicalTime());seek.value=t;currentLabel.textContent=fmt(t);});
volume.oninput=()=>{video.volume=Number(volume.value);showControls();};
fullscreenTop.onclick=toggleFullscreen;

document.querySelectorAll('input[name="qualityMode"]').forEach(radio=>{
 radio.addEventListener("change",()=>{
  showControls();if(!radio.checked)return;
  const wantLow=radio.value==="low";if(wantLow===lowBandwidth)return;
  const t=logicalTime();lowBandwidth=wantLow;started=false;logicalOffset=0;start(t);
 });
});
if(audioSelect)audioSelect.onchange=()=>{showControls();if(started&&!usingDirect())go(logicalTime());};
if(subtitleSelect)subtitleSelect.onchange=()=>{showControls();if(started){usingDirect()?subtitles(0):go(logicalTime());}};

["pointermove","pointerdown","touchstart"].forEach(type=>playerShell.addEventListener(type,showControls,{passive:true}));
playerControls.addEventListener("pointerenter",()=>{clearControlsTimer();playerShell.classList.remove("controls-hidden");});
playerControls.addEventListener("pointerleave",scheduleControlsHide);

document.addEventListener("keydown",event=>{
 if(event.key==="f"||event.key==="F"){event.preventDefault();toggleFullscreen();return;}
 if(event.key===" "&&!["INPUT","SELECT","BUTTON"].includes(event.target.tagName)){event.preventDefault();togglePlay.click();return;}
 showControls();
});
document.addEventListener("fullscreenchange",updateFullscreenState);
document.addEventListener("webkitfullscreenchange",updateFullscreenState);
video.addEventListener("webkitbeginfullscreen",updateFullscreenState);
video.addEventListener("webkitendfullscreen",updateFullscreenState);
window.addEventListener("DOMContentLoaded",()=>{start(0);updateFullscreenState();});
</script><script src="{{ url_for('static', filename='favorite.js') }}" defer></script></body></html>
