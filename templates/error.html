{% extends "base.html" %}
{% block content %}<section class="media-error"><h1>{{ error_title|default('Unable to open this item') }}</h1>{% if filename %}<p class="muted">{{ filename }}</p>{% endif %}<p class="error-box">{{ message }}</p><a class="primary" href="{{ back_url|default(url_for('home')) }}">← {{ 'Back to folder' if back_url else 'Media roots' }}</a></section>{% endblock %}
