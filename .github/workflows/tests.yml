name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Add 7-Zip to PATH
        shell: pwsh
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip'
          if (-not (Test-Path (Join-Path $sevenZip '7z.exe'))) { throw '7-Zip is required for viewer tests' }
          $sevenZip | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run Python tests
        run: python -B -m unittest discover -s tests -v
      - name: Run JavaScript tests
        run: node --test tests/player.test.cjs tests/explorer.test.cjs tests/cleanup.test.cjs
