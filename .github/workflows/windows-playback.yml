name: Windows playback diagnostics

on:
  push:
    branches: [main, codex/windows-hls-startup, codex/windows-upgrade-bundle]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-playback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check Windows ownership, listener and HLS startup (no FFmpeg encoding)
        run: >-
          python -B -m unittest -v tests.test_hls_streams tests.test_launcher tests.test_n100_bundle tests.test_installer
          tests.test_app.ExplorerRoutes.test_hls_preparation_waits_without_a_media_503_and_reuses_encoder
          tests.test_app.ExplorerRoutes.test_hls_playlist_serves_completed_segments_with_ranges_and_scope_checks
          tests.test_app.ExplorerRoutes.test_hls_rejects_nonfinite_start_and_reports_encoder_failure
          tests.test_app.ExplorerRoutes.test_explicit_qsv_diagnostics_never_run_a_software_encoder_test
          tests.test_app.ExplorerRoutes.test_hls_preparation_reports_spawn_errors_without_private_exception_text
          tests.test_app.ExplorerRoutes.test_hevc_sources_offer_normal_and_low_and_reject_removed_copy_mode
          tests.test_app.ExplorerRoutes.test_qsv_hls_forced_keyframes_are_idr_frames_for_segment_boundaries
      - name: Check player and explorer
        run: node --test tests/player.test.cjs tests/explorer.test.cjs
      - name: Check process inspector and stop guards on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\process_check_tests.ps1
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm LANStream.spec
      - name: Launch the frozen Windows app (no media tools or encoding)
        shell: pwsh
        run: |
          $env:LANSTREAM_RUNTIME_EXE = (Resolve-Path 'dist/LANStream/LANStream.exe').Path
          python -B -m unittest -v tests.test_windows_runtime
      - name: Package diagnostic instructions and identity
        shell: pwsh
        run: |
          Copy-Item 'scripts/Run QSV Diagnostics.cmd' 'dist/LANStream/'
          Copy-Item 'scripts/Check-LANStreamProcesses.ps1' 'dist/LANStream/'
          Copy-Item 'docs/n100-process-check.md' 'dist/LANStream/README-PROCESS-CHECK.md'
          Copy-Item 'docs/windows-playback-diagnostics.md' 'dist/LANStream/README-DIAGNOSTICS.md'
          Copy-Item 'LICENSE' 'dist/LANStream/'
          Copy-Item 'THIRD_PARTY_LICENSES.md' 'dist/LANStream/'
          $identity = [ordered]@{
            source_commit = '${{ github.sha }}'
            executable_sha256 = (Get-FileHash 'dist/LANStream/LANStream.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
            native_windows_fixture_checks = 'passed'
            real_qsv_playback_verified = $false
          }
          $identity | ConvertTo-Json | Set-Content -Encoding utf8 'dist/LANStream/BUILD-IDENTITY.json'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LANStream-Windows-QSV-Diagnostics
          path: dist/LANStream/
          retention-days: 14
          if-no-files-found: error
      - name: Package the installed-app update
        shell: pwsh
        run: |
          $folder = 'release/LANStream-Enhanced'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item 'dist/LANStream/LANStream.exe' $folder
          Copy-Item 'dist/LANStream/_internal' $folder -Recurse
          Copy-Item 'dist/LANStream/BUILD-IDENTITY.json' $folder
          Copy-Item 'README-UPDATE-WINDOWS.txt','LICENSE','THIRD_PARTY_LICENSES.md' $folder
          Copy-Item 'scripts/Check-LANStreamProcesses.ps1' $folder
          Copy-Item 'docs/n100-process-check.md' "$folder/README-PROCESS-CHECK.md"
          Compress-Archive -Path $folder -DestinationPath 'release/LANStream-Enhanced-Windows-x64-Update.zip'
          $hash = (Get-FileHash 'release/LANStream-Enhanced-Windows-x64-Update.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LANStream-Enhanced-Windows-x64-Update.zip" | Set-Content -Encoding ascii 'release/SHA256SUMS.txt'
          $manifest = [ordered]@{ archive = 'LANStream-Enhanced-Windows-x64-Update.zip'; sha256 = $hash; revision = '${{ github.sha }}'; package_kind = 'application-update' }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 'release/release-manifest.json'
          python -B scripts/build_n100_bundle.py --upgrade-only --artifact-directory release
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade bundle build failed' }
      - name: Verify real portable upgrade, saved data and rollback (no encoding)
        shell: pwsh
        run: |
          $env:LANSTREAM_UPGRADE_ZIP = (Resolve-Path 'release/LANStream-Enhanced-Windows-x64-Update.zip').Path
          $env:LANSTREAM_UPGRADE_MANIFEST = (Resolve-Path 'release/release-manifest.json').Path
          python -B -m unittest -v tests.test_upgrade
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LANStream-Enhanced-Windows-x64-Release
          path: |
            release/LANStream-Enhanced-Windows-x64-Update.zip
            release/SHA256SUMS.txt
            release/LANStream-Enhanced-Upgrade.zip
            release/LANStream-Enhanced-Upgrade.zip.sha256
          retention-days: 30
          if-no-files-found: error
